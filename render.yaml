# Import this Blueprint in the Render dashboard after merging it into main.
services:
  - type: web
    name: nexus-agent
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
# Render supplies PORT automatically. Configure the LLM provider variables
# (LLM_PROVIDER, LLM_API_KEY, LLM_MODEL, optional LLM_BASE_URL/LLM_TIMEOUT_MS)
# in the Render dashboard to enable the agent execution endpoints; until then
# those endpoints respond with 503 while /api/health stays green.
